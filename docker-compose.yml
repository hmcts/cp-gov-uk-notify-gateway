services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: govuknotifygateway
      POSTGRES_USER: govuknotifygateway
      POSTGRES_PASSWORD: govuknotifygateway
    # No host port mapping: the app reaches Postgres over the compose network at `postgres:5432`.
    # (Avoids clashing with a Postgres already bound to host 5432.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govuknotifygateway -d govuknotifygateway"]
      interval: 5s
      timeout: 3s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The app requires Postgres (JPA + Flyway); point it at the compose service so it can start for
      # local runs and the DAST job. Flyway creates the notification table + the co-located jobs table.
      CP_NG_DATASOURCE_URL: jdbc:postgresql://postgres:5432/govuknotifygateway
      CP_NG_DATASOURCE_USERNAME: govuknotifygateway
      CP_NG_DATASOURCE_PASSWORD: govuknotifygateway
      # Gov.Notify key is mandatory to boot (GovNotifyConfig fails fast on a blank key). This is a
      # non-functional Gov.Notify TEST-key placeholder so the app starts for local runs and the DAST
      # scan; no real notifications are sent (no Service Bus is wired here). Real keys come from Key Vault.
      CP_NG_GOVNOTIFY_API_KEY: cpngtest-00000000-0000-0000-0000-000000000000-11111111-1111-1111-1111-111111111111
      CP_NG_SYSTEM_USER_ID: 0f0e0d0c-0b0a-4908-8706-050403020100
      CP_NG_MATERIAL_BASE_URL: http://material-service-stub/material-service
      # Office 365 route endpoint and key are mandatory to boot (Office365Settings fails fast when blank).
      # Non-functional placeholders: nothing is ever sent here (no Service Bus is wired). Real values come
      # from Key Vault.
      CP_NG_OFFICE365_ENDPOINT: http://office365-stub/api/Generate-Notification-Email
      CP_NG_OFFICE365_SUBSCRIPTION_KEY: cpngtest-office365-subscription-key
