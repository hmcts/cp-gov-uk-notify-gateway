version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/" # location of build.gradle
    schedule:
      interval: "daily" # or "weekly", "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # json-schema-validator 3.x is a breaking API redesign (JsonSchemaFactory→SchemaRegistry,
      # JsonSchema→Schema, ValidationMessage→Error, SpecVersion→SpecificationVersion). ContractSchema
      # targets the 1.5.x API; block major bumps until the helper is migrated. Minor/patch still flow.
      - dependency-name: "com.networknt:json-schema-validator"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/" # location of your workflow files
    schedule:
      interval: "weekly"