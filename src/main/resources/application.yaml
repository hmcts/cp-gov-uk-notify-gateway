spring:
  application:
    name: cp-gov-uk-notify-gateway
  datasource:
    url: ${CP_NG_DATASOURCE_URL:jdbc:postgresql://localhost:5432/govuknotifygateway}
    username: ${CP_NG_DATASOURCE_USERNAME:govuknotifygateway}
    password: ${CP_NG_DATASOURCE_PASSWORD:govuknotifygateway}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: cp-gov-uk-notify-gateway-hikari
      maximum-pool-size: ${CP_NG_DB_POOL_SIZE:20}
      minimum-idle: ${CP_NG_DB_MIN_IDLE:5}
      auto-commit: false   # transactions committed explicitly (@Transactional) — required for the FR-003 atomic INSERT + enqueue
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema owned by Flyway; Hibernate only validates mappings match the DB
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.connection.provider_disables_autocommit: true
  flyway:
    enabled: true
    # classpath:db/migration is augmented at runtime by cp-task-manager's
    # TaskManagerFlywayAutoConfiguration, which merges classpath:db/taskmanager (the `jobs` table)
    # into this same Flyway run — no manual spring.flyway.locations entry needed (AC-001a).

server:
  port: ${SERVER_PORT:8082}

cp:
  notification:
    servicebus:
      # Auth switches by config (NG-S07): connection-string is the emulator/local exception (NFR-002);
      # when it is blank the client authenticates to `namespace` with DefaultAzureCredential (Managed
      # Identity in AKS). Both blank -> the ASB consumer is inactive (local runs / non-ASB tests start cleanly).
      connection-string: ${CP_NG_SERVICEBUS_CONNECTION_STRING:}
      # Fully-qualified namespace, e.g. my-namespace.servicebus.windows.net (Managed Identity path).
      namespace: ${CP_NG_SERVICEBUS_NAMESPACE:}
      command-queue: ${CP_NG_SERVICEBUS_COMMAND_QUEUE:ng-send-email}
    blob:
      # Empty by default -> AttachmentDownloader uses DefaultAzureCredential (Workload Identity),
      # addressing the command's fileUri directly. Set the connection string only for Azurite/local
      # (emulator-only, NFR-002).
      connection-string: ${CP_NG_BLOB_CONNECTION_STRING:}
      # Allow-list of storage-account hosts a Managed-Identity token may be sent to (SSRF / token-exfil
      # guard on the wire-borne fileUri). Comma-separated; set per env/stack in the Helm overlay to that
      # stack's storage account host(s), e.g. sa<env>filestore.blob.core.windows.net. Empty ->
      # fail-closed (every host rejected) in Workload-Identity mode; ignored in connection-string mode.
      allowed-hosts: ${CP_NG_BLOB_ALLOWED_HOSTS:}
      # Absolute max attachment size (bytes), matching legacy BYTE_LENGTH_15_MB. The attachment is
      # buffered whole into memory and its size is wire-influenced via the fileUri, so a larger blob is
      # rejected as a permanent failure BEFORE downloading (OOM guard). Note the 2MB Gov.Notify limit is
      # a separate, lower routing threshold handled in EmailClientFactory (>2MB -> Office 365, NG-S10).
      max-attachment-bytes: ${CP_NG_BLOB_MAX_ATTACHMENT_BYTES:15728640}
    govnotify:
      base-url: ${CP_NG_GOVNOTIFY_BASE_URL:https://api.notifications.service.gov.uk}
      # Gov.Notify API key — injected from Key Vault in deployed environments; never a real key in config.
      api-key: ${CP_NG_GOVNOTIFY_API_KEY:}
      # Corporate egress proxy for the outbound Gov.Notify HTTPS call, ported from the legacy
      # notification context (gov.notify.proxy.*). Disabled by default: environments with direct
      # outbound egress (STE/DEV verified) need nothing. Enable per environment in the Helm overlay
      # where egress must traverse the corporate IMZO proxy (e.g. the prod nonlive/live proxy hosts).
      proxy:
        enabled: ${CP_NG_GOVNOTIFY_PROXY_ENABLED:false}
        host: ${CP_NG_GOVNOTIFY_PROXY_HOST:}
        port: ${CP_NG_GOVNOTIFY_PROXY_PORT:0}
    retry:
      # Preserved legacy email retry/poll backoff (seconds); legacy default from
      # notify.email.retry.threshold.durations. Overridable per environment without a redeploy.
      email-durations-secs: ${CP_NG_EMAIL_RETRY_DURATIONS_SECS:60,300,1800,3600,7200,14400}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true   # enables liveness / readiness groups
  otlp:
    metrics:
      export:
        # OTLP metrics export is off by default until an OTEL collector is available;
        # flip on per-environment via OTEL_METRICS_ENABLED without a redeploy.
        enabled: ${OTEL_METRICS_ENABLED:false}
        url: ${OTEL_METRICS_URL:http://localhost:4318/v1/metrics}

logging:
  level:
    root: INFO
    com.azure: WARN
