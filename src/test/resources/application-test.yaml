# Test-profile overrides (active via @ActiveProfiles("test") on the integration/acceptance bases).
# No OTLP collector runs during tests, so disable the OTLP exporters — otherwise the OTLP metric/trace
# push fails with ConnectException to http://localhost:4318 on context shutdown, spamming WARN logs.
management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    enabled: false

# Only the shared full-application context (sanity + BDD) loads cp-task-manager's poller; the sliced
# boundary tests don't. A fast poll drives the async job pipeline promptly in the BDD suite.
job:
  executor:
    poll-interval: 200

cp:
  notification:
    office365:
      endpoint: http://office365.invalid/api/Generate-Notification-Email
      subscription-key: cpngtest-office365-subscription-key
    material:
      system-user-id: 0f0e0d0c-0b0a-4908-8706-050403020100
    retry:
      email-durations-secs: 1,1,1
      letter-durations-secs: 1,1,1
      letter-status-durations-secs: 1,1,1
      letter-accepted-status-durations-secs: 1,1,1

# @SpringBootTest activates Spring Boot's LoggingApplicationListener, which re-applies logging.level
# from config onto the logback context at startup — overriding logback-test.xml's root=ERROR with the
# root=INFO from application.yaml (leaking HikariCP/Tomcat INFO). Re-assert the quiet levels here so the
# Spring-managed override matches logback-test.xml: everything ERROR, this application at INFO.
logging:
  level:
    root: ERROR
    uk.gov.hmcts.cp.notification: INFO
    com.azure: ERROR
