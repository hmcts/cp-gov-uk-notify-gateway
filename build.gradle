plugins {
  id 'application'
  id 'java'
  id 'org.springframework.boot' version '4.1.1'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'jacoco'
  id 'maven-publish'
  id 'com.github.ben-manes.versions' version '0.62.0'
  id 'org.cyclonedx.bom' version '3.4.1'
  id 'com.gorylenko.gradle-git-properties' version '4.0.1'
}

group = 'uk.gov.hmcts.cp'
version = System.getProperty('ARTEFACT_VERSION') ?: '0.0.999'

apply {
  from("$rootDir/gradle/repositories.gradle")
  from("$rootDir/gradle/java.gradle")
  from("$rootDir/gradle/dependency.gradle")
  from("$rootDir/gradle/pmd.gradle")
  from("$rootDir/gradle/test.gradle")
  from("$rootDir/gradle/jar.gradle")
}

// We MUST keep all dependencies in the build.gradle to allow dependabot to provide version updates
// Sadly, dependabot does not track dependencies in the apply-from files
dependencies {
  // Java core
  implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

  compileOnly 'org.projectlombok:lombok:1.18.48'
  annotationProcessor 'org.projectlombok:lombok:1.18.48'
  testCompileOnly 'org.projectlombok:lombok:1.18.48'
  testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

  // Spring boot core
  implementation 'org.springframework.boot:spring-boot-starter-web'
  // Bean Validation (jakarta) — validates the inbound SendEmailCommand and provides the Validator bean
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  // Security (NG-S04) — interim permit-all filter chain over the read query API; real auth arrives in NG-S14
  implementation 'org.springframework.boot:spring-boot-starter-security'
  testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
  // @DataJpaTest slice (Boot 4 modular test starter) for the repository boundary test — no full context
  testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
  testImplementation('org.springframework.boot:spring-boot-starter-test') {
    exclude group: 'junit', module: 'junit'
    exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
  }
  // TestRestTemplate (real-HTTP sanity test) builds on RestTemplateBuilder, which moved to the
  // spring-boot-restclient module in Boot 4 and is not pulled in transitively by the test starters.
  testImplementation 'org.springframework.boot:spring-boot-restclient'

  // BDD / acceptance tests — plain Cucumber on JUnit Platform + Spring (no Serenity)
  testImplementation platform('io.cucumber:cucumber-bom:7.34.8')
  testImplementation 'io.cucumber:cucumber-java'
  testImplementation 'io.cucumber:cucumber-junit-platform-engine'
  testImplementation 'io.cucumber:cucumber-spring'
  // Gradle discovers tests by class, so the Cucumber engine needs a @Suite entry point to run
  testImplementation 'org.junit.platform:junit-platform-suite'
  testImplementation 'org.junit.platform:junit-platform-launcher'


  // --- Observability / Actuator / OTEL / Prometheus ---
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'

  // Security: pin transitive tomcat-embed-core to patched version (CVE-2026-41293, -43512, et al.)
  // Brought in transitively via spring-boot-starter-web; >=11.0.0-M1,<11.0.22 are vulnerable
  implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.25'

  // --- Persistence: JPA + Postgres + Flyway (NG-S01) ---
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.postgresql:postgresql'
  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-database-postgresql'

  // --- Async engine: cp-task-manager (embedded library; co-locates the `jobs` table via its own
  //     Flyway auto-config merged into the app's single Flyway run — see AC-001a) ---
  implementation 'uk.gov.hmcts.cp:task-manager-service:1.0.10'
  // cp-task-manager's ExecutionInfo.jobData is a jakarta JsonObject
  implementation 'jakarta.json:jakarta.json-api:2.1.3'
  // jakarta.json provider at runtime — the ingest service and SendEmailTask build/read JsonObject payloads
  runtimeOnly 'org.eclipse.parsson:parsson:1.1.9'

  // Gov.UK Notify official client — same library and version as the legacy notification context;
  // owns the JWT auth, request payload serialisation, and response parsing (contract parity).
  implementation 'uk.gov.service.notify:notifications-java-client:6.2.0-RELEASE'

  // --- Azure integrations (NG-S02): ASB command consumer + Blob attachment download ---
  // Managed Identity in real envs (DefaultAzureCredential); connection-string only for emulator/local.
  implementation 'com.azure:azure-messaging-servicebus:7.17.20'
  implementation 'com.azure:azure-storage-blob:12.35.1'
  implementation 'com.azure:azure-identity:1.18.6'

  // --- Integration testing: Postgres via Testcontainers ---
  testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
  testImplementation 'org.testcontainers:testcontainers'
  testImplementation 'org.testcontainers:testcontainers-postgresql'

  // --- NG-S02 integration harness: ASB emulator (+ MSSQL backing), Azurite blob, WireMock, Awaitility ---
  // The Azure SDKs (azure-messaging-servicebus, azure-storage-blob, azure-identity) are now production
  // `implementation` deps above — the ASB consumer + blob AttachmentDownloader need them at runtime — so
  // the tests inherit them from the main classpath.

  // ASB emulator container needs an MSSQL backing store (see AbstractServiceBusIntegrationTest / README).
  testImplementation 'org.testcontainers:testcontainers-azure'
  testImplementation 'org.testcontainers:testcontainers-mssqlserver'
  testRuntimeOnly 'com.microsoft.sqlserver:mssql-jdbc:13.6.0.jre11'

  // Gov.UK Notify HTTP boundary is stubbed with WireMock (standalone flavour = shaded Jetty, no clash
  // with the app's embedded Tomcat); Awaitility drives the async ASB/cp-task-manager assertions.
  testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
  testImplementation 'org.awaitility:awaitility:4.3.0'
  testImplementation 'net.javacrumbs.json-unit:json-unit-assertj:6.2.0'
  // Pinned to 1.5.2: 3.x is a breaking API redesign (JsonSchemaFactory→SchemaRegistry,
  // JsonSchema→Schema, ValidationMessage→Error, SpecVersion→SpecificationVersion). ContractSchema
  // targets the 1.5.x API. See dependabot ignore for semver-major on this artifact.
  testImplementation 'com.networknt:json-schema-validator:1.5.9'

  // OpenAPI conformance (NG-S04): validate the query controller's requests/responses against the
  // in-repo OpenAPI 3.0 contract at contracts/openapi/gov-uk-notify-gateway.openapi.yaml via MockMvc.
  // Pinned to 2.46.1: 3.0.0 transitively requires json-schema-validator 3.x (uses
  // com.networknt.schema.format.Format, absent in 1.5.x) → NoClassDefFoundError at runtime with the
  // pinned 1.5.2 above. This pair (2.46.1 + 1.5.2) is the compatible set; bump both together when
  // ContractSchema is migrated to the networknt 3.x API. See dependabot ignore.
  testImplementation 'com.atlassian.oai:swagger-request-validator-mockmvc:2.46.1'
}
